services:
  - type: web
    name: nivraa-pricing-api
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm run test && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRICING_VERSION
        value: 2026.10.01
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_DOCS
        value: false
      - key: API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
